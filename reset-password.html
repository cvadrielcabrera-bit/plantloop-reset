<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PlantLoop – Cambiar contraseña</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #1a3d2b;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: #fff;
      border-radius: 20px;
      padding: 32px 28px;
      width: 100%;
      max-width: 400px;
      text-align: center;
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    }
    .logo { font-size: 28px; font-weight: 800; color: #1a3d2b; margin-bottom: 6px; }
    .logo span { color: #4a9e6b; }
    .subtitle { font-size: 14px; color: #666; margin-bottom: 24px; }
    label { display: block; text-align: left; font-size: 13px; font-weight: 600; color: #333; margin-bottom: 4px; margin-top: 14px; }
    input {
      width: 100%; padding: 12px 14px; border: 1.5px solid #ddd;
      border-radius: 10px; font-size: 15px; outline: none;
      transition: border-color 0.2s;
    }
    input:focus { border-color: #4a9e6b; }
    button {
      width: 100%; margin-top: 20px; padding: 14px;
      background: #1a3d2b; color: #fff; border: none;
      border-radius: 12px; font-size: 16px; font-weight: 700;
      cursor: pointer; transition: background 0.2s;
    }
    button:hover { background: #4a9e6b; }
    button:disabled { background: #aaa; cursor: default; }
    .msg {
      margin-top: 16px; padding: 12px 16px;
      border-radius: 10px; font-size: 14px; line-height: 1.5;
    }
    .msg.error { background: #fff0f0; color: #cc3333; border: 1px solid #ffaaaa; }
    .msg.success { background: #f0fff4; color: #1a6b3a; border: 1px solid #aaddbb; }
    .back { display: block; margin-top: 16px; font-size: 13px; color: #4a9e6b; text-decoration: none; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">🌿 Plant<span>Loop</span></div>
    <div class="subtitle" id="subtitle">Nueva contraseña</div>

    <div id="formSection">
      <label for="pass">Nueva contraseña</label>
      <input type="password" id="pass" placeholder="Mínimo 6 caracteres" />
      <label for="pass2">Confirmar contraseña</label>
      <input type="password" id="pass2" placeholder="Repite la contraseña" />
      <button id="btn" onclick="cambiar()">✓ Guardar contraseña</button>
    </div>

    <div id="msg"></div>
    <a href="#" class="back" id="backLink" style="display:none" onclick="window.close()">← Cerrar y volver a la app</a>
  </div>

  <script>
    const SUPABASE_URL = 'https://uiracsglkjbrkaznsxwx.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_Hbt_oRYn_iYKniPizU0g5A_KdZjH3dn';

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // Extraer tokens del hash de la URL
    const hash = window.location.hash.substring(1);
    const params = new URLSearchParams(hash);
    const access_token = params.get('access_token');
    const refresh_token = params.get('refresh_token');
    const type = params.get('type');

    if (!access_token || type !== 'recovery') {
      document.getElementById('subtitle').textContent = 'Enlace inválido o expirado';
      document.getElementById('formSection').style.display = 'none';
      showMsg('Este enlace no es válido o ya expiró. Solicitá uno nuevo desde la app.', 'error');
    } else {
      // Establecer sesión con los tokens
      supabase.auth.setSession({ access_token, refresh_token });
    }

    async function cambiar() {
      const pass = document.getElementById('pass').value;
      const pass2 = document.getElementById('pass2').value;
      if (pass.length < 6) { showMsg('La contraseña debe tener al menos 6 caracteres.', 'error'); return; }
      if (pass !== pass2)  { showMsg('Las contraseñas no coinciden.', 'error'); return; }

      const btn = document.getElementById('btn');
      btn.disabled = true;
      btn.textContent = '...';

      const { error } = await supabase.auth.updateUser({ password: pass });

      if (error) {
        showMsg('Error: ' + error.message, 'error');
        btn.disabled = false;
        btn.textContent = '✓ Guardar contraseña';
      } else {
        document.getElementById('formSection').style.display = 'none';
        document.getElementById('subtitle').textContent = '✅ ¡Contraseña actualizada!';
        showMsg('Tu contraseña fue cambiada con éxito. Ya podés volver a la app e iniciar sesión.', 'success');
        document.getElementById('backLink').style.display = 'block';
      }
    }

    function showMsg(text, type) {
      const el = document.getElementById('msg');
      el.className = 'msg ' + type;
      el.textContent = text;
    }
  </script>
</body>
</html>
