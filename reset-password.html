<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PlantLoop – Cambiar contraseña</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #1a3d2b;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: #fff;
      border-radius: 20px;
      padding: 32px 28px;
      width: 100%;
      max-width: 400px;
      text-align: center;
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    }
    .logo { font-size: 28px; font-weight: 800; color: #1a3d2b; margin-bottom: 6px; }
    .logo span { color: #4a9e6b; }
    .subtitle { font-size: 14px; color: #666; margin-bottom: 24px; }
    label { display: block; text-align: left; font-size: 13px; font-weight: 600; color: #333; margin-bottom: 4px; margin-top: 14px; }
    input {
      width: 100%; padding: 12px 14px; border: 1.5px solid #ddd;
      border-radius: 10px; font-size: 15px; outline: none;
      transition: border-color 0.2s;
    }
    input:focus { border-color: #4a9e6b; }
    button {
      width: 100%; margin-top: 20px; padding: 14px;
      background: #1a3d2b; color: #fff; border: none;
      border-radius: 12px; font-size: 16px; font-weight: 700;
      cursor: pointer; transition: background 0.2s;
    }
    button:hover { background: #4a9e6b; }
    button:disabled { background: #aaa; cursor: default; }
    .msg {
      margin-top: 16px; padding: 12px 16px;
      border-radius: 10px; font-size: 14px; line-height: 1.5;
    }
    .msg.error { background: #fff0f0; color: #cc3333; border: 1px solid #ffaaaa; }
    .msg.success { background: #f0fff4; color: #1a6b3a; border: 1px solid #aaddbb; }
    .back { display: block; margin-top: 16px; font-size: 13px; color: #4a9e6b; text-decoration: none; }
    .spinner {
      display: inline-block; width: 14px; height: 14px;
      border: 2px solid rgba(255,255,255,0.4); border-top-color: #fff;
      border-radius: 50%; vertical-align: middle; margin-right: 6px;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">🌿 Plant<span>Loop</span></div>
    <div class="subtitle" id="subtitle">Nueva contraseña</div>

    <div id="formSection">
      <label for="pass" id="passLbl">Nueva contraseña</label>
      <input type="password" id="pass" placeholder="Mínimo 6 caracteres" />
      <label for="pass2" id="pass2Lbl">Confirmar contraseña</label>
      <input type="password" id="pass2" placeholder="Repite la contraseña" />
      <button id="btn" onclick="cambiar()">✓ Guardar contraseña</button>
    </div>

    <div id="msg"></div>
    <a href="#" class="back" id="backLink" style="display:none">← Cerrar y volver a la app</a>
  </div>

  <script>
    // ── Idioma: detecta es / de / en según el navegador ───────────────────────
    const LANG = (() => {
      const l = (navigator.language || 'es').toLowerCase();
      if (l.startsWith('de')) return 'de';
      if (l.startsWith('en')) return 'en';
      return 'es';
    })();

    const STR = {
      es: {
        title: 'PlantLoop – Cambiar contraseña',
        subtitle: 'Nueva contraseña',
        newPassLbl: 'Nueva contraseña',
        newPassPH: 'Mínimo 6 caracteres',
        confirmPassLbl: 'Confirmar contraseña',
        confirmPassPH: 'Repite la contraseña',
        saveBtn: '✓ Guardar contraseña',
        savingBtn: 'Guardando…',
        passMismatch: 'Las contraseñas no coinciden.',
        passTooShort: 'La contraseña debe tener al menos 6 caracteres.',
        updatedTitle: '✅ ¡Contraseña actualizada!',
        updatedMsg: 'Listo, tu contraseña fue modificada con éxito. Ya podés volver a la app e iniciar sesión.',
        invalidTitle: 'Enlace inválido o expirado',
        invalidMsg: 'Este enlace no es válido o ya expiró. Solicitá uno nuevo desde la app.',
        genericError: 'Ocurrió un error. Probá de nuevo o solicitá un nuevo enlace desde la app.',
        backLink: '← Cerrar y volver a la app',
      },
      de: {
        title: 'PlantLoop – Passwort ändern',
        subtitle: 'Neues Passwort',
        newPassLbl: 'Neues Passwort',
        newPassPH: 'Mindestens 6 Zeichen',
        confirmPassLbl: 'Passwort bestätigen',
        confirmPassPH: 'Passwort wiederholen',
        saveBtn: '✓ Passwort speichern',
        savingBtn: 'Wird gespeichert…',
        passMismatch: 'Die Passwörter stimmen nicht überein.',
        passTooShort: 'Das Passwort muss mindestens 6 Zeichen haben.',
        updatedTitle: '✅ Passwort aktualisiert!',
        updatedMsg: 'Fertig, dein Passwort wurde erfolgreich geändert. Du kannst jetzt zur App zurückkehren und dich anmelden.',
        invalidTitle: 'Ungültiger oder abgelaufener Link',
        invalidMsg: 'Dieser Link ist ungültig oder bereits abgelaufen. Fordere einen neuen in der App an.',
        genericError: 'Es ist ein Fehler aufgetreten. Versuche es erneut oder fordere einen neuen Link in der App an.',
        backLink: '← Schließen und zur App zurückkehren',
      },
      en: {
        title: 'PlantLoop – Change password',
        subtitle: 'New password',
        newPassLbl: 'New password',
        newPassPH: 'At least 6 characters',
        confirmPassLbl: 'Confirm password',
        confirmPassPH: 'Repeat password',
        saveBtn: '✓ Save password',
        savingBtn: 'Saving…',
        passMismatch: 'Passwords do not match.',
        passTooShort: 'Password must be at least 6 characters.',
        updatedTitle: '✅ Password updated!',
        updatedMsg: 'Done, your password was changed successfully. You can now go back to the app and log in.',
        invalidTitle: 'Invalid or expired link',
        invalidMsg: 'This link is invalid or has expired. Request a new one from the app.',
        genericError: 'Something went wrong. Try again or request a new link from the app.',
        backLink: '← Close and return to the app',
      },
    };
    const t = STR[LANG];

    // ── Aplicar textos traducidos a la página ─────────────────────────────────
    document.title = t.title;
    document.documentElement.lang = LANG;
    document.getElementById('subtitle').textContent = t.subtitle;
    document.getElementById('passLbl').textContent = t.newPassLbl;
    document.getElementById('pass').placeholder = t.newPassPH;
    document.getElementById('pass2Lbl').textContent = t.confirmPassLbl;
    document.getElementById('pass2').placeholder = t.confirmPassPH;
    document.getElementById('btn').textContent = t.saveBtn;
    document.getElementById('backLink').textContent = t.backLink;
    document.getElementById('backLink').onclick = () => { window.close(); return false; };

    function showMsg(text, kind) {
      const el = document.getElementById('msg');
      el.className = 'msg ' + kind;
      el.textContent = text;
    }

    function showInvalidLink() {
      document.getElementById('subtitle').textContent = t.invalidTitle;
      document.getElementById('formSection').style.display = 'none';
      showMsg(t.invalidMsg, 'error');
    }

    let supabase = null;
    let sessionReady = false;

    async function init() {
      try {
        if (!window.supabase || !window.supabase.createClient) {
          throw new Error('No se pudo cargar la librería de Supabase (revisá tu conexión y volvé a cargar la página).');
        }

        const SUPABASE_URL = 'https://uiracsglkjbrkaznsxwx.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_Hbt_oRYn_iYKniPizU0g5A_KdZjH3dn';

        // detectSessionInUrl:false → controlamos nosotros mismos el parseo del link,
        // así evitamos que el SDK lo haga en paralelo y "consuma" el token dos veces.
        supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
          auth: { detectSessionInUrl: false, persistSession: false, autoRefreshToken: false },
        });

        const hash = window.location.hash.substring(1);
        const params = new URLSearchParams(hash);
        const access_token = params.get('access_token');
        const refresh_token = params.get('refresh_token');
        const type = params.get('type');

        if (!access_token || !refresh_token || type !== 'recovery') {
          showInvalidLink();
          return;
        }

        const { error } = await supabase.auth.setSession({ access_token, refresh_token });
        if (error) {
          console.error('setSession error:', error);
          showInvalidLink();
          return;
        }

        sessionReady = true;
      } catch (e) {
        console.error('init error:', e);
        showInvalidLink();
      }
    }

    async function cambiar() {
      const pass = document.getElementById('pass').value;
      const pass2 = document.getElementById('pass2').value;
      if (pass.length < 6) { showMsg(t.passTooShort, 'error'); return; }
      if (pass !== pass2)  { showMsg(t.passMismatch, 'error'); return; }

      if (!sessionReady || !supabase) {
        showMsg(t.genericError, 'error');
        return;
      }

      const btn = document.getElementById('btn');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span>' + t.savingBtn;
      showMsg('', '');
      document.getElementById('msg').className = '';

      try {
        const { error } = await supabase.auth.updateUser({ password: pass });

        if (error) {
          console.error('updateUser error:', error);
          showMsg(t.genericError + ' (' + error.message + ')', 'error');
          btn.disabled = false;
          btn.textContent = t.saveBtn;
          return;
        }

        document.getElementById('formSection').style.display = 'none';
        document.getElementById('subtitle').textContent = t.updatedTitle;
        showMsg(t.updatedMsg, 'success');
        document.getElementById('backLink').style.display = 'block';
      } catch (e) {
        console.error('cambiar() exception:', e);
        showMsg(t.genericError, 'error');
        btn.disabled = false;
        btn.textContent = t.saveBtn;
      }
    }

    init();
  </script>
</body>
</html>
